version: 2

project_name: ralph

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/ralph
    binary: ralph
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew publishing is upstream's. This fork has no tap and no
# HOMEBREW_TAP_GITHUB_TOKEN, and goreleaser fails the whole release if the
# brews step cannot authenticate -- so the block is removed rather than left to
# break every tag. Releases here are plain binaries plus checksums, which is
# what scripts/install.sh consumes.
